<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sauni - Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="split-layout">

        <!-- VISUAL COLLAGE (left side for signup variety) -->
        <div class="split-right">
            <div class="slice-login" style="background-image: url('../images/foods/sekuwa.png');">
            </div>
            <div class="slice-login" style="background-image: url('../images/chefs/chef2.png');">
            </div>
            <div class="slice-login" style="background-image: url('../images/foods/kwantiDal.png');">
            </div>
            <div class="slice-login" style="background-image: url('../images/chefs/chef4.png');">
            </div>
        </div>

        <!-- SIGNUP FORM SIDE -->
        <div class="split-left">
            <div class="login-wrapper">
                <a href="../landing/landing.html" class="brand brand--signup">sauni</a>

                <div>
                    <h1>CREATE ACCOUNT</h1>
                    <p class="subtitle">Join us to explore authentic foods.</p>

                    <div class="error-box" id="error-box"></div>
                    <div class="success-box" id="success-box"></div>

                    <form id="signup-form">
                        <div class="input-group">
                            <label>Full Name</label>
                            <input type="text" id="name" name="name" placeholder="your name" required>
                        </div>

                        <div class="row">
                            <div class="input-group">
                                <label>Email Address</label>
                                <input type="email" id="email" name="email" placeholder="email@gmail.com" required>
                            </div>
                            <div class="input-group">
                                <label>Username</label>
                                <input type="text" id="username" name="username" placeholder="name123" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="input-group">
                                <label>Password</label>
                                <div class="pwd-wrapper">
                                    <input type="password" id="reg-pass" name="password" placeholder="••••••••"
                                        minlength="6" required style="padding-right: 30px;">
                                    <span class="eye-toggle" onclick="togglePass('reg-pass', this)"
                                        aria-label="Toggle password visibility">
                                        <svg viewBox="0 0 24 24" class="eye-icon">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                            <circle cx="12" cy="12" r="3" />
                                        </svg>
                                    </span>
                                </div>
                            </div>
                            <div class="input-group">
                                <label>Confirm Password</label>
                                <div class="pwd-wrapper">
                                    <input type="password" id="reg-cpass" name="confirm_password" placeholder="••••••••"
                                        minlength="6" required style="padding-right: 30px;">
                                    <span class="eye-toggle" onclick="togglePass('reg-cpass', this)"
                                        aria-label="Toggle password visibility">
                                        <svg viewBox="0 0 24 24" class="eye-icon">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                            <circle cx="12" cy="12" r="3" />
                                        </svg>
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div class="action-btns action-btns--signup">
                            <button type="submit" class="btn-primary">Sign Up</button>
                            <button type="button" class="btn-outline"
                                onclick="location.href='index.html'">Login</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <!-- PRIVACY MODAL -->
    <div class="modal-backdrop" id="privacyModal" onclick="if(event.target===this)closeModal('privacyModal')">
        <div class="modal-content">
            <div class="modal-head">
                <h3>Privacy Policy</h3>
                <button class="modal-close" onclick="closeModal('privacyModal')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p>We collect your name, email, order history, and location (for delivery). We never sell your data.</p>
                <h4>Data Security</h4>
                <p>Passwords are hashed. Data is encrypted in transit.</p>
                <h4>Your Rights</h4>
                <p>Request data deletion at privacy@sauni.com.</p>
            </div>
            <div class="modal-foot">
                <button class="btn-accept" onclick="closeModal('privacyModal')">Understood</button>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
