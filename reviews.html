<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Board | Sauni Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="reviews.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Sidebar -->
    <aside>
        <div class="logo">
            <img src="assets/images/logo.png" alt="Sauni Logo" class="sidebar-logo">
        </div>

        <div class="nav-section">
            <span class="nav-label">Main</span>
            <nav>
                <ul>
                    <li>
                        <a href="dashboard.html" class="nav-item">
                            <i class="fa-solid fa-table-columns"></i>
                            Dashboard
                        </a>
                    </li>
                    <li>
                        <a href="orders.html" class="nav-item">
                            <i class="fa-solid fa-rectangle-list"></i>
                            Orders
                        </a>
                    </li>
                    <li>
                        <a href="menu.html" class="nav-item">
                            <i class="fa-solid fa-utensils"></i>
                            Menu
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <div class="nav-section">
            <span class="nav-label">Operations</span>
            <nav>
                <ul>
                    <li>
                        <a href="drivers.html" class="nav-item">
                            <i class="fa-solid fa-truck"></i>
                            Drivers & Map
                        </a>
                    </li>
                    <li>
                        <a href="reviews.html" class="nav-item active">
                            <i class="fa-solid fa-star"></i>
                            Reviews
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="avatar">A</div>
                <div class="user-info">
                    <h4>Admin</h4>
                    <p>Reviews</p>
                </div>
            </div>
            <a href="logout.html" class="sign-out">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                Sign out
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main>
        <header>
            <div class="header-left">
                <h1>Review Board</h1>
                <p>Customer Experience Feedback</p>
            </div>
            <div class="header-right">
                <div class="avg-rating-pill">
                    <div class="live-dot"></div>
                    — Avg Rating
                </div>
            </div>
        </header>

        <section class="review-board-content">
            <!-- Review Summary Cards -->
            <div class="stats-cards-grid">
                <div class="review-stat-card">
                    <div class="stat-icon food">
                        <i class="fa-solid fa-star"></i>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-value">—</div>
                    <div class="stat-label">Avg Food Rating</div>
                </div>

                <div class="review-stat-card">
                    <div class="stat-icon driver">
                        <i class="fa-solid fa-bicycle"></i>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-value">—</div>
                    <div class="stat-label">Avg Driver Rating</div>
                </div>

                <div class="review-stat-card">
                    <div class="stat-icon total">
                        <i class="fa-solid fa-clipboard-list"></i>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-value">—</div>
                    <div class="stat-label">Total Reviews</div>
                </div>
            </div>

            <!-- Empty State -->
            <div class="review-empty-state">
                <div class="large-star-icon">
                    <i class="fa-regular fa-star"></i>
                </div>
                <h3>No reviews yet</h3>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script src="reviews.js"></script>
</body>
</html>
