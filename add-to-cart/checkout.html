<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sauni — Checkout</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="checkout.css">
</head>

<body>

    <header>
        <nav class="customer-nav">
            <a href="../landing/landing.html" class="cn-logo">Sauni</a>
            <div class="cn-links">
                <a href="../landing/landing.html" class="cn-link">Discover</a>
                <a href="../landing/landing.html" class="cn-link">Browse All</a>
                <a href="tracker.html" class="cn-link">Track Order</a>
                <a href="../landing/landing.html" class="cn-link">History</a>
                <a href="../login/index.html" class="cn-link" id="logout-link">Logout</a>
                <button class="cn-cart" id="cartPill" onclick="location.href='checkout.html'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle">
                        <circle cx="9" cy="21" r="1" />
                        <circle cx="20" cy="21" r="1" />
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
                    </svg>
                    <span data-cart-count>0</span>
                </button>
            </div>
        </nav>
    </header>

    <div class="layout" id="layout">

        <!-- ORDER PANEL -->
        <div class="order-panel" id="orderPanel">
            <div class="op-inner" id="opInner">Loading...</div>
        </div>

        <!-- MAP PANEL -->
        <div class="map-panel">
            <div class="map-search">
                <input type="text" id="placeSearch" placeholder="Search: Thamel, Boudha, Patan..."
                    onkeydown="if(event.key==='Enter') searchPlace()">
                <button onclick="searchPlace()">Search</button>
            </div>
            <div class="place-results" id="placeResults"></div>
            <div id="map"></div>
            <div class="map-hint" id="mapHint">📍 Click anywhere or drag pin to set your location</div>
        </div>

    </div>

    <script src="map.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="checkout.js"></script>
</body>

</html>
